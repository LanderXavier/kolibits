# Ajustes compartidos por todos los sitios
index index.html;
charset utf-8;

gzip on;
gzip_types text/css application/javascript image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Todos los sitios leen el mismo archivo de contacto
location = /contacto.json {
    alias /datos/contacto.json;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}

location / {
    try_files $uri $uri/ =404;
}

# Logos, tipografías y video casi nunca cambian: el navegador los guarda una semana
location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
}
