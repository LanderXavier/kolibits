# Un bloque por sitio: nginx elige cuál mostrar según el nombre con el que se entra.
# Los nombres .localhost sirven para probar en tu computadora sin tocar nada más.

# kolibits.com (principal). Sirve la MISMA carpeta que auto.kolibits.com: lo que
# la gente encuentra al buscar «Kolibits» es la landing de automatizaciones.
# La tienda, cuando exista, irá en una carpeta aparte.
server {
    listen 80 default_server;
    server_name kolibits.com www.kolibits.com kolibits.localhost;
    root /usr/share/nginx/auto.kolibits.com;
    include /etc/nginx/kolibits-comun.conf;
}

# auto.kolibits.com (automatizaciones)
server {
    listen 80;
    server_name auto.kolibits.com auto.kolibits.localhost;
    root /usr/share/nginx/auto.kolibits.com;
    include /etc/nginx/kolibits-comun.conf;
}

# tienda.kolibits.com: cuando exista, copia el bloque anterior con su carpeta.
